name: Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: checks-${{ github.ref }}

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run check