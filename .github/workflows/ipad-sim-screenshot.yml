name: iPad Simulator Screenshot

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions: {}

jobs:
  screenshot:
    if: contains(github.event.pull_request.labels.*.name, 'ipad sim')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - run: npm ci

      - name: Start Nuxt dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/nuxt-dev.log 2>&1 &
          echo $! > /tmp/nuxt-dev.pid

      - name: Wait for preview route
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ipad-sim >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Nuxt route did not become ready in time"
          exit 1

      - name: Boot an available iPad Simulator
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available | awk '
            /iPad/ {
              if (match($0, /[0-9A-Fa-f-]{36}/)) {
                print substr($0, RSTART, RLENGTH);
                exit
              }
            }
          ')"
          if [ -z "$DEVICE_UDID" ]; then
            echo "No available iPad simulator found"
            exit 1
          fi

          echo "Using simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          xcrun simctl openurl "$DEVICE_UDID" "http://127.0.0.1:4173/ipad-sim"
          sleep 20

          mkdir -p output/ipad-sim
          xcrun simctl io "$DEVICE_UDID" screenshot "output/ipad-sim/ipad-sim-safari.png"

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-sim-screenshot
          path: |
            output/ipad-sim/
            /tmp/nuxt-dev.log

      - name: Stop Nuxt dev server
        if: always()
        run: |
          if [ -f /tmp/nuxt-dev.pid ]; then
            kill "$(cat /tmp/nuxt-dev.pid)" || true
          fi
