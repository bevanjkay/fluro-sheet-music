name: Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: checks-${{ github.ref }}

permissions: {}

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run check
      - name: Add coverage summary
        run: |
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Test coverage\n\n| Metric | Coverage |\n| --- | --- |\n| Lines | ' + s.lines.pct + '% |\n| Statements | ' + s.statements.pct + '% |\n| Functions | ' + s.functions.pct + '% |\n| Branches | ' + s.branches.pct + '% |\n')"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
